teacher_name: &teacher_name EleutherAI/pythia-1.4b-deduped
students: 
  layer_reduction:
    name: *teacher_name
    factor: 1/3
  dim_reduction:
    name: EleutherAI/pythia-410m-deduped

projector_training:
  dataset: common-pile/comma_v0.1_training_dataset
  total_tokens: 1000

training_params:
  seed: [44] # [3, 27, 44]
  seq_len: 128
  num_epochs: 10
  reproducible_backend: true

hook_types:
  single:
    - "hook_embed"
  per_layer:
    - "attn.hook_attn_scores"
    - "hook_attn_out"
    - "hook_mlp_out"
    - "hook_resid_post"

projection:
  directions: ['up']  # ["up", "down"]
  training_methods: ["offline"]  #["online", "offline"]

offline_projector_alignment_betas: [0.5]  # [0.0, 0.25, 0.5, 0.75, 1.0]

objective_weight_variants:
  # - "only_outputs"
  - "balanced"
  # - "no_embed"
  # - "no_attn"
  # - "no_mlp"
  # - "no_resid"
  # - "with_embed"
  # - "with_attn"
  # - "with_mlp"
  # - "with_resid"

jsd_betas: [0.5]  # [0.0, 0.25, 0.5, 0.75, 1.0]

hyperparams:
  lr: [1e-6]  # [1e-6, 5e-6, 1e-5, 5e-5]
  weight_decay: [0.0]  # [1e-5, 1e-3, 1e-2, 0.1]
  temperature: [1.0]  # [0.1, 0.5, 1.0, 2.0]
  max_grad_norm: [1.0]  # [0.1, 0.5, 1.0, 2.0]
  # num_epochs: [3]  # [3, 6, 9]
  batch_size: [8]  # [8, 16, 32]

tasks:
  hellaswag:
    dataset: Rowan/hellaswag
  # triviaqa:
  #   dataset: mandarjoshi/trivia_qa
  # boolq:
  #   dataset: google/boolq
