teacher_name: &teacher_name EleutherAI/pythia-1.4b-deduped
students: 
  shallow:
    name: *teacher_name
    factor: 1/3
  narrow:
    name: EleutherAI/pythia-410m-deduped

directories:
  root: results
  cache: cache
  models: models
  scores: scores

offline_projector_params:
  alignment_betas: [0.5]  # [0.0, 0.25, 0.5, 0.75, 1.0]
  training_args:
    dataset: 
      name: common-pile/comma_v0.1_training_dataset
      subset: null
      split: train
      shuffle: false
      token_rename: false
    total_tokens: 1024  # 1000000
    cache_batch_size: 8
    n_trials: 1  # 15
    force_cache_all: false
    num_gpus_per_trial: 2.0
    num_cpus_per_trial: 16

# lm_training_params:
#   num_gpus_per_trial: 1.0
#   num_cpus_per_trial: 8

training_params:
  seed: 44 # [3, 27, 44]
  seq_len: 128  # 2048
  num_epochs: 10
  reproducible_backend: true
  num_workers: 1  # 4
  device: 'cuda'  # 'mps' (?)

hook_types:
  single:
    - "hook_embed"
  per_layer:
    - "attn.hook_attn_scores"
    - "hook_attn_out"
    - "hook_mlp_out"
    - "hook_resid_post"

projection_variants:
  directions: ['up']  # ["up", "down"]
  training_methods: ["online", "offline"]

# offline_projector_alignment_betas: [0.5]  # [0.0, 0.25, 0.5, 0.75, 1.0]

objective_weight_variants:
  # - "only_outputs"
  - "balanced"
  # - "no_embed"
  # - "no_attn"
  # - "no_mlp"
  # - "no_resid"
  # - "with_embed"
  # - "with_attn"
  # - "with_mlp"
  # - "with_resid"

jsd_betas: [0.5]  # [0.0, 0.25, 0.5, 0.75, 1.0]

hyperparams:
  lr:
    mini: 1e-6
    maxi: 1e-4  # [1e-6, 5e-6, 1e-5, 5e-5]
  weight_decay:
    mini: 1e-4
    maxi: 0.1  # [1e-5, 1e-3, 1e-2, 0.1]
  temperature:
    mini: 0.1
    maxi: 2.0  # [0.1, 0.5, 1.0, 2.0]
  max_grad_norm:
    mini: 0.1
    maxi: 2.0  # [0.1, 0.5, 1.0, 2.0]
  batch_sizes: [8]  # [8, 16, 32]

tasks:
  arc_challenge:
    dataset: allenai/ai2_arc
    subset: ARC-Challenge
  arc_easy:
    dataset: allenai/ai2_arc
    subset: ARC-Easy
  boolq:
    dataset: aps/super_glue
    subset: boolq
  hellaswag:
    dataset: Rowan/hellaswag
  logiqa2:
    dataset: baber/logiqa2
  piqa:
    dataset: baber/piqa
  sciq:
    dataset: allenai/sciq
  winogrande:
    dataset: allenai/winogrande
    subset: winogrande_xl

  # triviaqa:
  #   dataset: mandarjoshi/trivia_qa
  #   subset: rc.nocontext

