# running on server2

teacher_name: &teacher_name EleutherAI/pythia-1.4b-deduped
students: 
  shallow:
    name: *teacher_name
    layer_reduction_factor: 1/6
  narrow:
    name: EleutherAI/pythia-410m-deduped
    kd_layer_filter_factors: ['1']  # [1/4, 1/2, 3/4, '1']


directories:
  root: results
  cache: cache
  models: models
  scores: scores
  ray: ray
  lightning: lightning

offline_projector_params:
  alignment_betas: [0.5]  # [0.0, 0.25, 0.5, 0.75, 1.0]
  training_args:
    dataset: 
      name: common-pile/comma_v0.1_training_dataset
      subset: null
      split: train
      shuffle: false
      token_rename: false
    total_tokens: 1000000
    cache_batch_size: 8
    num_epochs: 1
    n_trials: 8
    force_cache_all: false

lm_params:
  num_samples: null
  num_epochs: 5
  n_trials: 8  # 15
  test_batch_size: 64

training_params:
  get_baselines: false
  run_or_test: run
  testing_mode: pl  # hf

  seed: 44 # [3, 27, 44]
  seq_len: 256  # 2048
  reproducible_backend: true
  device: 'cuda'
  torch_dtype: bfloat16
  resources:
    max_failures: 10
    num_available_gpus: 2
    projector:
      num_data_workers: 0
      num_ray_workers: 1
      num_cpus_per_trial: 12
      num_gpus_per_trial: 1.0
    teacher:
      num_data_workers: 0
      num_ray_workers: 1
      num_cpus_per_trial: 12
      num_gpus_per_trial: 1.0
    student:
      num_data_workers: 0
      num_ray_workers: 1
      num_cpus_per_trial: 12
      num_gpus_per_trial: 1.0


hook_types:
  single:
    - "hook_embed"
  per_layer:
    - "attn.hook_attn_scores"
    - "hook_attn_out"
    - "hook_mlp_out"
    - "hook_resid_post"

projection_variants:
  directions: ["up", "down"]
  training_methods: ["offline", "online", "randomized"]

objective_weight_variants:
  - "only_outputs"
  # - "balanced"
  # - "no_embed"
  # - "no_attn"
  # - "no_mlp"
  # - "no_resid"
  # - "with_embed"
  # - "with_attn"
  # - "with_mlp"
  # - "with_resid"

jsd_betas: [0.0, 0.25, 0.5, 0.75, 1.0]

hyperparams:
  lr:
    mini: 1e-6
    maxi: 1e-4  # [1e-6, 5e-6, 1e-5, 5e-5]
  weight_decay:
    mini: 1e-4
    maxi: 0.1  # [1e-5, 1e-3, 1e-2, 0.1]
  temperature:
    mini: 0.1
    maxi: 2.0  # [0.1, 0.5, 1.0, 2.0]
  max_grad_norm:
    mini: 0.1
    maxi: 2.0  # [0.1, 0.5, 1.0, 2.0]
  batch_sizes: [8]  # [8, 16, 32]

tasks:
  hellaswag:
    dataset_name: Rowan/hellaswag
